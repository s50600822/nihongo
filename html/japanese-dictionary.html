*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}

input{width:100%;padding:14px 16px;font-size:1.05rem;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);outline:none}
input:focus{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--text);padding:4px 12px;border-radius:999px;font-size:.82rem;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.count{color:var(--muted);font-size:.82rem;margin:6px 0 10px}
.entry{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:8px;cursor:pointer}
.row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.jp{font-size:1.6rem;font-weight:600}
.kana{color:var(--accent);font-size:1rem}
.lvl{margin-left:auto;font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.mean{margin-top:2px}
.more{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:.9rem;color:var(--muted)}
.entry.open .more{display:block}
.more b{color:var(--text);font-weight:600}
.btn{margin-top:8px;border:1px solid var(--line);background:var(--chip);color:var(--text);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:.82rem}
.empty{text-align:center;color:var(--muted);padding:32px 0}
</style>

const D=RAW.split("\n").map((l,i)=>{const[a,b,c,d,e,f,g,h]=l.split("|");return{id:i,w:a,k:b,r:c,m:d,p:e,l:f,ex:g,et:h}});
const $=id=>document.getElementById(id);
let lvl="All",pos="All";
const toHira=s=>s.replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));
const mk=(el,opts,get,set)=>{el.innerHTML="";opts.forEach(o=>{const b=document.createElement("button");b.className="chip"+(get()===o?" on":"");b.textContent=o;b.onclick=()=>{set(o);mk(el,opts,get,set);render()};el.appendChild(b)})};
function score(e,q){
  const h=toHira(q),m=e.m.toLowerCase();
  if(e.w===q||e.k===h||e.r===q||m===q)return 0;
  if(m.split(/,\s*/).includes(q))return 1;
  if(m.startsWith(q)||e.r.startsWith(q)||e.k.startsWith(h)||e.w.startsWith(q))return 2;
  if(m.includes(q)||e.r.includes(q)||e.k.includes(h)||e.w.includes(q))return 3;
  return -1;
}
function render(){
  const q=$("q").value.trim().toLowerCase();
  let r=D.filter(e=>(lvl==="All"||e.l===lvl)&&(pos==="All"||e.p===pos));
  if(q){r=r.map(e=>[score(e,q),e]).filter(x=>x[0]>=0).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}
  $("count").textContent=r.length+" of "+D.length+" entries";
  const L=$("list");L.innerHTML="";
  if(!r.length){L.innerHTML='<div class="empty">No matches found.</div>';return}
  r.forEach(e=>{
    const d=document.createElement("div");d.className="entry";
    d.innerHTML=`<div class="row"><span class="jp">${e.w}</span><span class="kana">${e.k}</span><span class="lvl">${e.l}</span></div>
    <div class="mean">${e.m} <span style="color:var(--muted);font-size:.8rem">· ${e.p}</span></div>
    <div class="more"><div><b>Romaji:</b> ${e.r}</div><div style="margin-top:4px"><b>Example:</b> ${e.ex}</div><div>${e.et}</div>
    <button class="btn">🔊 Pronounce</button></div>`;
    d.onclick=()=>d.classList.toggle("open");
    d.querySelector(".btn").onclick=ev=>{ev.stopPropagation();try{const u=new SpeechSynthesisUtterance(e.k);u.lang="ja-JP";speechSynthesis.cancel();speechSynthesis.speak(u)}catch(x){}};
    L.appendChild(d);
  });
}
mk($("lv"),["All","N5","N4"],()=>lvl,v=>lvl=v);
mk($("ps"),["All",...new Set(D.map(e=>e.p))],()=>pos,v=>pos=v);
$("q").addEventListener("input",render);
render();
</script>
