<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kanji Radical Lookup</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#1f1d1a;--mute:#7a756c;--line:#e3ded4;--acc:#b3382c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171614;--card:#201f1c;--ink:#eee9df;--mute:#9a9487;--line:#34322d;--acc:#ee7a6c}}
:root[data-theme="dark"]{--bg:#171614;--card:#201f1c;--ink:#eee9df;--mute:#9a9487;--line:#34322d;--acc:#ee7a6c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
main{max-width:900px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}
.sub{margin:0 0 14px;color:var(--mute)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,button{font:inherit;color:inherit}
input,select{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
input{flex:1;min-width:180px}
button{cursor:pointer}
.btn{padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.sel{min-height:34px;margin-bottom:10px;color:var(--mute)}
.sel b{font-size:22px;color:var(--acc);font-weight:600;margin-right:6px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:16px;max-height:340px;overflow-y:auto}
.grp{display:flex;gap:8px;padding:4px 0}
.grp+.grp{border-top:1px dashed var(--line)}
.n{flex:0 0 22px;color:var(--mute);font-size:12px;padding-top:9px;text-align:right}
.rads{display:flex;flex-wrap:wrap;gap:4px}
.r{width:38px;height:38px;font-size:20px;border:1px solid var(--line);border-radius:8px;background:var(--bg);line-height:1;padding:0}
.r:hover:not(:disabled){border-color:var(--acc)}
.r.on{background:var(--acc);border-color:var(--acc);color:#fff}
.r:disabled{opacity:.22;cursor:default}
.count{color:var(--mute);margin-bottom:8px}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.k{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center}
.k:hover{border-color:var(--acc)}
.k .c{font-size:34px;line-height:1.15}
.k .s{font-size:11px;color:var(--mute)}
.more{display:block;margin:14px auto 0}
.empty{color:var(--mute);padding:20px 0}
#det{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.15);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:none}
#det.show{display:block}
.dw{max-width:900px;margin:0 auto;display:flex;gap:16px;align-items:flex-start}
.big{font-size:72px;line-height:1;color:var(--acc)}
.di{flex:1;min-width:0}
.di p{margin:2px 0}
.lab{color:var(--mute);font-size:12px;margin-right:6px}
.chips button{width:32px;height:32px;margin:2px 4px 0 0;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:17px;padding:0}
.x{border:0;background:none;font-size:22px;color:var(--mute)}
a{color:var(--acc)}
</style>
</head>

<div class="sel" id="sel"></div>
<div class="panel" id="pan"></div>
<div class="count" id="cnt"></div>
<div class="res" id="res"></div>
<button class="btn more" id="more" hidden>Show more</button>
</main>

const sel=new Set(),$=id=>document.getElementById(id);
let shown=240,hits=[];
const g=d=>d[2];
function filt(){
  const lim=+$("f").value,t=$("q").value.trim().toLowerCase();
  const base=DATA.filter(d=>(!lim||(g(d)>0&&g(d)<=lim))&&[...sel].every(r=>d[6].includes(r)));
  const hit=t?base.filter(d=>d[0]===t||d[3].includes(t)||d[4].includes(t)||d[5].toLowerCase().includes(t)):base;
  return[base,hit];
}
function render(reset){
  if(reset)shown=240;
  const[base,hit]=filt();hits=hit;
  const poss=new Set(base.flatMap(d=>[...d[6]]));
  const pan=$("pan"),top=pan.scrollTop;pan.innerHTML="";
  RADS.forEach(([n,s])=>{
    const e=document.createElement("div");e.className="grp";
    e.innerHTML='<div class="n">'+n+'</div><div class="rads"></div>';
    [...s].forEach(r=>{
      const b=document.createElement("button");
      b.className="r"+(sel.has(r)?" on":"");b.textContent=r;
      b.disabled=!sel.has(r)&&!poss.has(r);
      b.onclick=()=>{sel.has(r)?sel.delete(r):sel.add(r);render(1)};
      e.lastChild.appendChild(b);
    });
    pan.appendChild(e);
  });
  pan.scrollTop=top;
  $("sel").innerHTML=sel.size?[...sel].map(r=>"<b>"+r+"</b>").join(""):"No radicals selected";
  $("cnt").textContent=hit.length.toLocaleString()+" kanji";
  const res=$("res");res.innerHTML="";
  if(!hit.length)res.innerHTML='<div class="empty">No kanji match. Try removing a radical.</div>';
  hit.slice(0,shown).forEach(d=>{
    const b=document.createElement("button");b.className="k";
    b.innerHTML='<div class="c">'+d[0]+'</div><div class="s">'+d[1]+' strokes</div>';
    b.onclick=()=>detail(d);res.appendChild(b);
  });
  $("more").hidden=hit.length<=shown;
}
function detail(d){
  $("dk").textContent=d[0];
  const gl=d[2]?(d[2]<=6?"Grade "+d[2]:d[2]==8?"Jōyō (secondary)":"Jinmeiyō"):"Rare";
  $("di").innerHTML='<p><span class="lab">Meaning</span>'+(d[5]||"—")+'</p><p><span class="lab">On</span>'+(d[3]||"—")+'</p><p><span class="lab">Kun</span>'+(d[4]||"—")+'</p><p><span class="lab">Strokes</span>'+d[1]+' · '+gl+'</p><div class="chips"><span class="lab">Radicals</span></div><p><button class="btn" id="cp">Copy</button> <a target="_blank" rel="noopener" href="https://jisho.org/search/'+encodeURIComponent(d[0])+'%20%23kanji">Jisho</a></p>';
  const ch=$("di").querySelector(".chips");
  [...d[6]].forEach(r=>{const b=document.createElement("button");b.textContent=r;b.title="Add to selection";b.onclick=()=>{sel.add(r);render(1)};ch.appendChild(b)});
  $("cp").onclick=()=>{const e=$("cp");try{navigator.clipboard.writeText(d[0])}catch(x){}e.textContent="Copied";setTimeout(()=>e.textContent="Copy",1000)};
  $("det").classList.add("show");
}
$("dx").onclick=()=>$("det").classList.remove("show");
$("q").oninput=()=>render(1);$("f").onchange=()=>render(1);
$("more").onclick=()=>{shown+=480;render()};
$("clr").onclick=()=>{sel.clear();$("q").value="";render(1)};
render(1);
</script>
